name: Deploy to Neubox FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.medicodigital.com.mx
          username: DonPacifico@pacifico.digital
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /pacifico.digital/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .claude/**
            Contenido/**
            "temporary screenshots/**"
